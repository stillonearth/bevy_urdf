[package]
name = "bevy_urdf"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Import robots from URDF files and run simulation with rapier."
keywords = ["rapier", "bevy", "urdf", "robotics"]
repository = "https://github.com/stillonearth/bevy_urdf"

[dependencies]
anyhow = "1.0"
bevy = { version = "0.17", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "png",
] }
rapier3d-urdf = { version = "0.10", features = ["stl", "wavefront"] }
rapier3d = { version = "0.29", features = ["serde-serialize"] }
bevy_rapier3d = { git = "https://github.com/lukasfri/bevy_rapier.git", rev="394257f", features = [
    "simd-stable",
    "serde-serialize",
] }
bevy_stl = { git = "https://github.com/stillonearth/bevy_stl.git", rev = "a75392d" }
bevy_obj = "0.17"
urdf-rs = "0.9"
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
nalgebra = "0.34.1"
csv = "1.3.1"
uom = "0.37"
uav = { version = "0.2.0" }
roxmltree = "0.21"
queues = "1.0.2"
k = "0.32"
rerun = "0.27.2"
const_format = "0.2.35"

[patch.crates-io]
fast_ode = { path = "patches/fast_ode-1.0.0" }

[dev-dependencies]
bevy = { version = "0.17", default-features = false, features = [
    "bevy_asset",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_state",
    "bevy_winit",
    "bevy_window",
    "tonemapping_luts",
    "x11",
    "png",
    "zstd_rust",
] }
bevy_flycam = { git = "https://github.com/stillonearth/bevy_flycam.git", rev = "aee5ff6" }
bevy-inspector-egui = "0.34.0"
tokio = { version = "1.0", features = ["full"] }
env_logger = "0.11.8"
bevy_infinite_grid = { git = "https://github.com/AllenDang/bevy_infinite_grid.git", rev = "e157d19" }
bevy_panorbit_camera = "0.30"
